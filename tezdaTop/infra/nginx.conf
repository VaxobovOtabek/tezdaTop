server {
    listen 80;
    server_name localhost yaqintop.uz www.yaqintop.uz;

    # Gzip siqish
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # API endpoints
    location /api/v1/ {
        proxy_pass http://api:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Foydalanuvchi / Xaridor sahifasi (/customer)
    location /customer {
        alias /usr/share/nginx/html/customer;
        try_files $uri $uri/ /customer/index.html;
    }

    # Do'kon boshqaruvi sahifasi (/owner va /merchant)
    location /owner {
        alias /usr/share/nginx/html/merchant;
        try_files $uri $uri/ /owner/index.html;
    }
    location /merchant {
        alias /usr/share/nginx/html/merchant;
        try_files $uri $uri/ /owner/index.html;
    }

    # Admin portali sahifasi (/admin)
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # Moderator portali sahifasi (/moderator)
    location /moderator {
        alias /usr/share/nginx/html/moderator;
        try_files $uri $uri/ /moderator/index.html;
    }

    # Rasmiy Lending sahifasi (Root /)
    location / {
        root /usr/share/nginx/html/landing;
        try_files $uri $uri/ /index.html;
    }
}
