server {
    listen 80;
    server_name localhost yaqintop.uz www.yaqintop.uz _;

    # Standard security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # =========================================================================
    # Backend Express API Proxy
    # Must never be cached in public static caches
    # =========================================================================
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable caching for all API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # =========================================================================
    # Customer App (/customer)
    # Vite base: /customer/
    # =========================================================================
    location = /customer {
        return 301 /customer/;
    }

    location ^~ /customer/assets/ {
        alias /usr/share/nginx/html/customer/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /customer/ {
        alias /usr/share/nginx/html/customer/;
        try_files $uri $uri/ /customer/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    # Merchant App (/owner & /merchant)
    # Vite base: /owner/
    # =========================================================================
    location = /owner {
        return 301 /owner/;
    }

    location = /merchant {
        return 301 /owner/;
    }

    location ^~ /merchant/ {
        return 301 /owner/;
    }

    location ^~ /owner/assets/ {
        alias /usr/share/nginx/html/merchant/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /owner/ {
        alias /usr/share/nginx/html/merchant/;
        try_files $uri $uri/ /owner/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    # Admin App (/admin)
    # Vite base: /admin/
    # =========================================================================
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    # Moderator App (/moderator)
    # Vite base: /moderator/
    # =========================================================================
    location = /moderator {
        return 301 /moderator/;
    }

    location ^~ /moderator/assets/ {
        alias /usr/share/nginx/html/moderator/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /moderator/ {
        alias /usr/share/nginx/html/moderator/;
        try_files $uri $uri/ /moderator/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    # Dealer App (/diller & /dealer)
    # Vite base: /diller/
    # =========================================================================
    location = /diller {
        return 301 /diller/;
    }

    location = /dealer {
        return 301 /diller/;
    }

    location ^~ /dealer/ {
        return 301 /diller/;
    }

    location ^~ /diller/assets/ {
        alias /usr/share/nginx/html/dealer/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /diller/ {
        alias /usr/share/nginx/html/dealer/;
        try_files $uri $uri/ /diller/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    # Shared Datasets and Service Worker updates
    # =========================================================================
    location ~* (sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # =========================================================================
    # Official Landing Page (Root /)
    # Vite base: /
    # =========================================================================
    location ^~ /assets/ {
        root /usr/share/nginx/html/landing;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html/landing;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
