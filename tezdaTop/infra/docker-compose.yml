name: yaqintop

services:
  # =========================================================================
  # Production Services (Default profile - started by `docker compose up`)
  # =========================================================================

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: yaqintop-api
    restart: unless-stopped
    # Port is internal only, accessible strictly via the reverse proxy
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      CUSTOMER_APP_URL: ${CUSTOMER_APP_URL:-http://localhost/customer}
      MERCHANT_APP_URL: ${MERCHANT_APP_URL:-http://localhost/owner}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost/admin}
      MODERATOR_APP_URL: ${MODERATOR_APP_URL:-http://localhost/moderator}
      DEALER_APP_URL: ${DEALER_APP_URL:-http://localhost/diller}
      LANDING_APP_URL: ${LANDING_APP_URL:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/api/v1/health/live\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - yaqintop-network

  reverse-proxy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: yaqintop-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - yaqintop-network

  # =========================================================================
  # Development Auxiliary Services (Isolated via `dev` profile)
  # Not started in production unless `--profile dev` is explicitly provided
  # =========================================================================

  postgres:
    profiles:
      - dev
    image: postgis/postgis:16-3.4
    container_name: yaqintop-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-yaqintop_db}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-yaqintop}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-yaqintop} -d ${DEV_POSTGRES_DB:-yaqintop_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yaqintop-network

  minio:
    profiles:
      - dev
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: yaqintop-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${DEV_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DEV_MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - yaqintop-network

  mailpit:
    profiles:
      - dev
    image: axllent/mailpit:latest
    container_name: yaqintop-dev-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP port
      - "127.0.0.1:8025:8025" # Web UI
    networks:
      - yaqintop-network

networks:
  yaqintop-network:
    driver: bridge

volumes:
  pgdata:
  miniodata:
