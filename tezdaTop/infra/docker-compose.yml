version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: yaqintop-postgres
    restart: always
    environment:
      POSTGRES_DB: yaqintop_db
      POSTGRES_USER: yaqintop
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaqintop -d yaqintop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: yaqintop-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: yaqintop-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: yaqintop-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://yaqintop:secretpassword@postgres:5432/yaqintop_db
      CUSTOMER_APP_URL: http://localhost
      MERCHANT_APP_URL: http://localhost/merchant
      ADMIN_APP_URL: http://localhost/admin
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  reverse-proxy:
    image: nginx:alpine
    container_name: yaqintop-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
